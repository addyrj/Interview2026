<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>119. CSS Loading Spinner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Loading Spinners</h1>

  <div class="row">
    <!-- 1. Classic ring spinner. role=status + visually hidden text for screen readers -->
    <figure>
      <div class="spinner" role="status"><span class="sr-only">Loading...</span></div>
      <figcaption>Ring</figcaption>
    </figure>

    <!-- 2. Three bouncing dots -->
    <figure>
      <div class="dots" role="status" aria-label="Loading"><i></i><i></i><i></i></div>
      <figcaption>Dots</figcaption>
    </figure>

    <!-- 3. Pulse -->
    <figure>
      <div class="pulse" role="status" aria-label="Loading"></div>
      <figcaption>Pulse</figcaption>
    </figure>

    <!-- 4. Skeleton card loader (shimmer) -->
    <figure>
      <div class="skeleton" aria-hidden="true">
        <div class="sk sk-img"></div>
        <div class="sk sk-line"></div>
        <div class="sk sk-line short"></div>
      </div>
      <figcaption>Skeleton</figcaption>
    </figure>
  </div>

  <!-- 5. Button with spinner -->
  <p class="center"><button class="btn" type="button" disabled><span class="spinner spinner--sm"></span> Placing order...</button></p>
</body>
</html>
