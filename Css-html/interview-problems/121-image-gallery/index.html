<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>121. Image Gallery with Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Image Gallery (CSS Grid)</h1>
    <p class="hint">Colour tiles stand in for photos, so no external images are needed. Replace each .tile with an &lt;img&gt; (see notes).</p>

    <!-- Each figure is one tile. Classes wide/tall/big make some tiles span more cells -->
    <section class="gallery" aria-label="Photo gallery">
      <figure class="tile c1 big"><div class="ph">1</div><figcaption>Mumbai</figcaption></figure>
      <figure class="tile c2"><div class="ph">2</div><figcaption>Goa</figcaption></figure>
      <figure class="tile c3"><div class="ph">3</div><figcaption>Jaipur</figcaption></figure>
      <figure class="tile c4 tall"><div class="ph">4</div><figcaption>Kerala</figcaption></figure>
      <figure class="tile c5 wide"><div class="ph">5</div><figcaption>Ladakh</figcaption></figure>
      <figure class="tile c6"><div class="ph">6</div><figcaption>Delhi</figcaption></figure>
      <figure class="tile c7"><div class="ph">7</div><figcaption>Pune</figcaption></figure>
      <figure class="tile c8"><div class="ph">8</div><figcaption>Agra</figcaption></figure>
    </section>
  </main>
</body>
</html>
