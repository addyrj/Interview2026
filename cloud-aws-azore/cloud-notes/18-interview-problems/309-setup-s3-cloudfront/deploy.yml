# GitHub Actions: build a React/Vite site, sync to S3, invalidate CloudFront
name: deploy-site
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gha-deploy-site
          aws-region: ap-south-1

      # Hashed assets: cache for a year. HTML: always revalidate.
      - name: Sync assets
        run: |
          aws s3 sync dist/ s3://${{ vars.SITE_BUCKET }}/ --delete \
            --exclude "index.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html s3://${{ vars.SITE_BUCKET }}/index.html \
            --cache-control "no-cache"

      - name: Invalidate index
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.DISTRIBUTION_ID }} --paths "/index.html"
